name: Update matchup data

on:
  schedule:
    # Every 15 minutes during MLB-ish hours (UTC ~11:00–06:45 covers ET day/evening)
    - cron: "*/15 11-23 * * *"
    - cron: "*/15 0-6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch matchups
        env:
          FOURCASTERS_USERNAME: ${{ secrets.FOURCASTERS_USERNAME }}
          FOURCASTERS_PASSWORD: ${{ secrets.FOURCASTERS_PASSWORD }}
        run: python scripts/fetch_matchups.py

      - name: Snapshot pre-game locks and grade Finals
        run: python scripts/snapshot_and_grade.py

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Update matchup data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
